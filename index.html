<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="واجهة نظام إدارة نادي الحاسبات" />
  <title>ClubOS | نادي الحاسبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">UQ</div>
        <div>
          <strong>ClubOS</strong>
          <span>نادي الحاسبات · جامعة أم القرى</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span> لوحة التحكم</button>
        <button class="nav-item" data-page="events"><span>◫</span> إدارة الفعاليات</button>
        <button class="nav-item" data-page="members"><span>◎</span> الموارد البشرية</button>
        <button class="nav-item" data-page="tasks"><span>✓</span> المهام</button>
        <button class="nav-item" data-page="quality"><span>✦</span> الجودة والحياة</button>
        <button class="nav-item" data-page="pr"><span>◇</span> العلاقات العامة</button>
        <button class="nav-item" data-page="marketing"><span>✎</span> اللجنة التسويقية</button>
        <button class="nav-item" data-page="sports"><span>🏆</span> المسابقات والأنشطة</button>
        <button class="nav-item" data-page="reports"><span>▥</span> التقارير</button>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-profile">
          <div class="avatar">ر</div>
          <div>
            <strong>ريماس فرج</strong>
            <span>رئيسة النادي</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-right">
          <button class="icon-btn mobile-only" id="menuBtn">☰</button>
          <div>
            <h1 id="pageTitle">لوحة التحكم</h1>
            <p id="pageSubtitle">نظرة شاملة على أداء النادي اليوم</p>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <input id="globalSearch" type="search" placeholder="بحث سريع..." />
          </div>
          <button class="icon-btn" id="themeBtn" title="تغيير المظهر">◐</button>
          <button class="icon-btn" title="الإشعارات">🔔<span class="dot"></span></button>
        </div>
      </header>

      <section id="pageContent" class="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">إضافة</h3>
        <button class="icon-btn" id="closeModal">×</button>
      </div>
      <form id="modalForm" class="modal-form"></form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
